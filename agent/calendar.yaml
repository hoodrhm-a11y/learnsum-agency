# School-year moments the planner leans into (Canada, mostly Ontario). Add dates only after checking official sources.
- window: "10-25..11-30"
  theme: "Fall progress reports and parent-teacher interviews: what to ask the teacher, how to read the report, small daily habits that help"
- window: "11-20..12-31"
  theme: "Winter break: keep learning light and fun at home (games, reading together, cooking math), screen-time balance"
- window: "01-01..01-31"
  theme: "New year routines: sleep, homework rhythm, 10-minute daily practice"
- window: "02-01..02-28"
  theme: "February is I Love to Read Month in Canada: reading together, sight words, story questions (who, where, what happened)"
- window: "03-01..03-20"
  theme: "March Break ideas: off-screen learning games, trips as learning (money, time, maps)"
- window: "04-15..06-20"
  theme: "End of year: report cards, getting ready for the next grade"
- window: "06-15..08-31"
  theme: "Summer learning loss: small daily practice, reading over summer, math in everyday life"
- window: "08-10..09-30"
  theme: "Back to school: routines, what your child learns this grade, first weeks"
- window: "all"
  theme: "Kindergarten readiness and early literacy/numeracy; what each grade learns (K-8); learning through play; LearnSum features in action (labs, games, daily path, character maker, parent reports)"
